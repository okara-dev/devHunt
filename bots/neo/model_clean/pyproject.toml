[project]
name = "qwen2-5-1-5b-instruct-onnx-genai-int4-kquantlast-emb-int4-runtime"
version = "0.1.0"
description = "Runtime dependencies for example.py (Qwen2.5-1.5B-Instruct GPTQ-INT4, onnxruntime-genai)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "onnxruntime-genai==0.14.1",
    # Held at the benchmarked runtime version. onnxruntime-genai only requires
    # >=1.26.0, but ONNX Runtime 1.28+ changes the INT4 MatMulNBits kernel path
    # and shifts the greedy argmax, so the committed predictions.json no longer
    # reproduces. 1.27.0 is also the version recorded in benchmarks/.
    "onnxruntime==1.27.0",
    "transformers==5.16.1",
]

[tool.uv]
package = false

[tool.ai-portal.deployment]
schema-version = "1"
runtime = "onnxruntime-genai"
required-capabilities = ["CPUExecutionProvider"]

[tool.ai-portal.deployment.ubuntu]
packages = []

[tool.ai-portal.deployment.raspbian]
packages = []

[tool.ai-portal.deployment.files]
expected = ["predictions.json"]
