input:
  type: text
  shape: [1, T]  # [batch, sequence], where T is dynamic up to 4096
  dtype: int64
  preprocessing:
    - tokenize:
        tokenizer: tokenizer.json  # HuggingFace AutoTokenizer (Qwen/Qwen2.5-1.5B-Instruct), BPE
        add_special_tokens: true
  notes: "No truncation/padding required for single-sequence greedy decode."

output:
  type: text
  shape: [1, N]  # N = prompt_tokens + generated_tokens (dynamic, grows during decode)
  format: "Generated token id sequence; detokenize to get text"
  postprocessing:
    - detokenize: "same AutoTokenizer as input, skip_special_tokens=true"
    - decoding_strategy: greedy (do_sample=false)
